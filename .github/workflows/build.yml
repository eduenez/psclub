name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The roster is FERPA-sensitive and git history is permanent, so this
      # runs before anything else and fails the whole workflow.
      - name: PII guard
        run: ./bin/check-pii.sh

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Gemfile.lock is a Bundler 4 lockfile (it carries sha256= checksums),
          # which Bundler 2.x cannot parse -- and 2.5.22 is what Ruby 3.3 ships
          # by default. Ask for the current Bundler explicitly rather than
          # relying on the runner's default matching the lockfile.
          bundler: latest
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Catches the failure mode a project site is prone to: links that work
      # locally and 404 in production because they lost the baseurl.
      - name: Build checks
        run: ./bin/check-build.sh _site "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
